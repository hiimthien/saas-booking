<style>
        .star-rating .material-symbols-outlined {
            font-variation-settings: 'FILL' 0;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .star-rating .material-symbols-outlined.active,
        .star-rating .material-symbols-outlined:hover {
            font-variation-settings: 'FILL' 1;
            color: #00855d; /* primary-container */
        }
        
        .chip-checkbox:checked + label {
            background-color: #e2dfff; /* secondary-fixed */
            color: #0f0069; /* on-secondary-fixed */
            border-color: #645efb; /* secondary-container */
        }
      </style>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Background Content (Simulated Session Summary) -->
<div class="absolute inset-0 z-0 p-lg opacity-40 pointer-events-none blur-sm flex flex-col items-center justify-center">
<div class="max-w-container-max w-full grid grid-cols-1 md:grid-cols-3 gap-lg">
<div class="bg-surface-container-lowest rounded-xl p-lg shadow-sm border border-outline-variant col-span-2">
<h2 class="font-headline-md text-headline-md mb-sm">Session Summary</h2>
<div class="h-64 bg-surface-container-low rounded-lg mb-md"></div>
<div class="h-8 bg-surface-container-low w-3/4 rounded mb-sm"></div>
<div class="h-8 bg-surface-container-low w-1/2 rounded"></div>
</div>
<div class="bg-surface-container-lowest rounded-xl p-lg shadow-sm border border-outline-variant flex flex-col gap-md">
<div class="w-full aspect-square rounded-full bg-surface-container-low mx-auto"></div>
<div class="h-10 bg-surface-container-low rounded w-full"></div>
<div class="h-10 bg-surface-container-low rounded w-full"></div>
</div>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-40 bg-on-surface/40 backdrop-blur-sm flex items-center justify-center p-md">
<!-- Modal Container -->
<div class="bg-surface-container-lowest w-full max-w-lg rounded-2xl shadow-xl border border-outline-variant overflow-hidden flex flex-col animate-[fade-in-up_0.3s_ease-out]">
<!-- Header -->
<div class="px-lg pt-lg pb-md flex justify-between items-start border-b border-surface-container-highest">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Rate Your Session</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs">How was your consultation with Dr. Smith?</p>
</div>
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-sm rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Body -->
<div class="p-lg flex flex-col gap-lg">
<!-- Star Rating -->
<div class="flex flex-col items-center justify-center py-sm">
<div class="star-rating flex gap-sm text-surface-dim">
<span class="material-symbols-outlined text-display-lg" data-rating="1">star</span>
<span class="material-symbols-outlined text-display-lg" data-rating="2">star</span>
<span class="material-symbols-outlined text-display-lg" data-rating="3">star</span>
<span class="material-symbols-outlined text-display-lg" data-rating="4">star</span>
<span class="material-symbols-outlined text-display-lg" data-rating="5">star</span>
</div>
<span class="font-label-md text-label-md text-primary mt-sm h-4" id="rating-text"></span>
</div>
<!-- Chips -->
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase mb-sm">What went well?</p>
<div class="flex flex-wrap gap-sm">
<div class="relative">
<input class="chip-checkbox peer sr-only" id="chip-1" type="checkbox"/>
<label class="inline-flex items-center gap-xs px-md py-sm rounded-full border border-outline-variant bg-surface-container-lowest font-body-sm text-body-sm text-on-surface cursor-pointer hover:bg-surface-container-low transition-colors select-none" for="chip-1">
                                Great Insights
                            </label>
</div>
<div class="relative">
<input class="chip-checkbox peer sr-only" id="chip-2" type="checkbox"/>
<label class="inline-flex items-center gap-xs px-md py-sm rounded-full border border-outline-variant bg-surface-container-lowest font-body-sm text-body-sm text-on-surface cursor-pointer hover:bg-surface-container-low transition-colors select-none" for="chip-2">
                                Very Professional
                            </label>
</div>
<div class="relative">
<input class="chip-checkbox peer sr-only" id="chip-3" type="checkbox"/>
<label class="inline-flex items-center gap-xs px-md py-sm rounded-full border border-outline-variant bg-surface-container-lowest font-body-sm text-body-sm text-on-surface cursor-pointer hover:bg-surface-container-low transition-colors select-none" for="chip-3">
                                Clear Communication
                            </label>
</div>
<div class="relative">
<input class="chip-checkbox peer sr-only" id="chip-4" type="checkbox"/>
<label class="inline-flex items-center gap-xs px-md py-sm rounded-full border border-outline-variant bg-surface-container-lowest font-body-sm text-body-sm text-on-surface cursor-pointer hover:bg-surface-container-low transition-colors select-none" for="chip-4">
                                Actionable Advice
                            </label>
</div>
</div>
</div>
<!-- Feedback Textarea -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase" for="feedback">Additional Comments (Optional)</label>
<textarea class="w-full rounded-lg border-outline-variant bg-surface-container-lowest font-body-sm text-body-sm text-on-surface focus:border-secondary focus:ring-1 focus:ring-secondary resize-none p-md placeholder:text-on-surface-variant/50" id="feedback" placeholder="Share more details about your experience..." rows="3"></textarea>
</div>
</div>
<!-- Footer Actions -->
<div class="px-lg py-md bg-surface-container-low flex justify-end gap-sm border-t border-surface-container-highest">
<button class="px-lg py-sm rounded-lg font-label-md text-label-md text-on-surface bg-surface-container-lowest border border-outline-variant hover:bg-surface-variant transition-colors">
                    Skip
                </button>
<button class="px-lg py-sm rounded-lg font-label-md text-label-md text-on-primary bg-primary hover:bg-primary-container transition-colors shadow-sm">
                    Submit Review
                </button>
</div>
</div>
</div>
<script>
        // Simple star rating interaction
        const stars = document.querySelectorAll('.star-rating span');
        const ratingText = document.getElementById('rating-text');
        const texts = ['Poor', 'Fair', 'Good', 'Very Good', 'Excellent'];
        
        let currentRating = 0;

        stars.forEach((star, index) => {
            star.addEventListener('mouseover', () => {
                highlightStars(index);
                ratingText.textContent = texts[index];
            });

            star.addEventListener('mouseout', () => {
                highlightStars(currentRating - 1);
                ratingText.textContent = currentRating > 0 ? texts[currentRating - 1] : '';
            });

            star.addEventListener('click', () => {
                currentRating = index + 1;
                highlightStars(index);
                ratingText.textContent = texts[index];
                
                // Add a little pop animation
                star.style.transform = 'scale(1.2)';
                setTimeout(() => {
                    star.style.transform = 'scale(1)';
                }, 150);
            });
        });

        function highlightStars(index) {
            stars.forEach((s, i) => {
                if (i <= index) {
                    s.classList.add('active');
                } else {
                    s.classList.remove('active');
                }
            });
        }
    </script>
</body></html>
